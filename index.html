<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faraz Shop</title>
<style>
:root{
  --bg:#060b18;--bg2:#0b1a3a;--ink:#eef3ff;--muted:#9fb2d6;--card:#0d1630;--line:#1f3a7a;
  --blue:#1e7bff;--orange:#ff9a1f;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8;
  background:radial-gradient(ellipse at 50% 0%,var(--bg2) 0%,var(--bg) 62%) fixed;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:14px 16px 36px}
.hero{width:100%;display:block;border-radius:18px;border:1px solid var(--line);
  box-shadow:0 0 28px rgba(30,123,255,.35),0 0 60px rgba(255,154,31,.10)}
h1{font-size:26px;margin:18px 0 2px;text-align:center;letter-spacing:.5px}
.tag{margin:0 0 20px;text-align:center;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:12px}
a.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;
  color:var(--ink);background:linear-gradient(135deg,#1e7bff,#1553c4);border:1px solid #4b97ff;box-shadow:0 0 18px rgba(30,123,255,.45);border-radius:14px;
  padding:15px 18px;font-size:17px;font-weight:600;transition:transform .12s,border-color .12s}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a.btn small{font-weight:400;color:#d6e6ff;direction:ltr;font-size:13px}
.hours{margin:22px 0 0;text-align:center;color:var(--orange);font-weight:600}
</style>
</head>
